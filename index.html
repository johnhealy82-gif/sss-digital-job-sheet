<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A63C8">
<title>SSS Secure Digital Job Sheet</title>
<style>
:root{--blue:#0A63C8;--green:#1F8F4D;--bg:#eef3f7;--ink:#172033;--line:#d8e0e8;--muted:#687586}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);margin:0;padding:14px;color:var(--ink)}
.wrap{max-width:850px;margin:auto;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 3px 16px rgba(0,0,0,.16)}
.head{background:var(--blue);color:#fff;padding:20px;text-align:center}
.head h1{font-size:26px;margin:0 0 4px}.head h2{font-size:17px;margin:0}
.sec{background:var(--green);color:#fff;padding:11px 15px;font-weight:800;letter-spacing:.2px}
.pad{padding:15px}
.field{margin-bottom:13px}
label.field-label{display:block;font-weight:800;margin-bottom:7px}
input[type=text],textarea{width:100%;padding:12px;border:1.5px solid #b8c2ce;border-radius:9px;box-sizing:border-box;font-size:16px;background:#fff}
.addr{height:68px;resize:vertical}.comments{height:100px;resize:vertical}
.job-types{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.job-types label{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:9px;padding:11px;font-weight:700;margin:0}
input[type=radio]{width:21px;height:21px;accent-color:var(--blue);flex:0 0 auto}
table{width:100%;border-collapse:collapse;margin-top:3px}
th,td{border:1px solid #d9dee5;padding:8px}
th{background:#f2f4f7;font-size:13px;text-align:center}
td:first-child{text-align:left;font-weight:700;font-size:14px;line-height:1.3}
td{text-align:center}
.sig-wrap{border:2px solid #8d98a6;border-radius:10px;background:#fff;overflow:hidden}
#signature{display:block;width:100%;height:170px;touch-action:none;background:#fff}
.sig-help{font-size:13px;color:var(--muted);margin-top:6px}
.sig-actions{display:flex;justify-content:flex-end;margin-top:9px}
button{border:none;border-radius:9px;font-weight:800}
.clear{background:#c62828;color:#fff;padding:10px 14px}
.share-area{padding:16px;position:sticky;bottom:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line)}
.share{width:100%;background:var(--blue);color:#fff;padding:16px;font-size:18px}
.status{display:none;margin:0 15px 15px;padding:12px;border-radius:9px;font-weight:700}
.status.ok{display:block;background:#e7f6ec;color:#176b39}.status.err{display:block;background:#fdeaea;color:#9b2020}
.footer{text-align:center;padding:0 15px 16px;color:var(--muted);font-size:12px}
@media(max-width:600px){body{padding:0}.wrap{border-radius:0;min-height:100vh}.head h1{font-size:24px}th,td{padding:7px 5px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><h1>SSS SECURE</h1><h2>Subcontractor Job Completion Checklist</h2></div>

  <div class="sec">JOB DETAILS</div>
  <div class="pad">
    <div class="field"><label class="field-label" for="builder">Builder</label><input id="builder" type="text"></div>
    <div class="field"><label class="field-label" for="address">Site Address</label><textarea id="address" class="addr"></textarea></div>
    <div class="field">
      <label class="field-label">Job Type</label>
      <div class="job-types">
        <label><input type="radio" name="jobType" value="Base Out">Base Out</label>
        <label><input type="radio" name="jobType" value="Lift Up">Lift Up</label>
        <label><input type="radio" name="jobType" value="Lift Down">Lift Down</label>
        <label><input type="radio" name="jobType" value="Dismantle">Dismantle</label>
      </div>
    </div>
    <div class="field"><label class="field-label" for="crew">Crew</label><input id="crew" type="text"></div>
    <div class="field"><label class="field-label" for="scaffolder">Competent Scaffolder</label><input id="scaffolder" type="text"></div>
  </div>

  <div class="sec">CHECKLIST</div>
  <div class="pad">
    <table>
      <thead><tr><th>Item</th><th>YES</th><th>NO</th><th>N/A</th></tr></thead>
      <tbody id="checklistBody"></tbody>
    </table>
  </div>

  <div class="sec">COMMENTS</div>
  <div class="pad"><textarea id="comments" class="comments"></textarea></div>

  <div class="sec">DECLARATION</div>
  <div class="pad">
    <div class="field"><label class="field-label" for="printName">Print Name</label><input id="printName" type="text"></div>
    <div class="field">
      <label class="field-label">Signature</label>
      <div class="sig-wrap"><canvas id="signature"></canvas></div>
      <div class="sig-help">Sign above using your finger.</div>
      <div class="sig-actions"><button type="button" id="clearSig" class="clear">Clear Signature</button></div>
    </div>
  </div>

  <div id="status" class="status"></div>
  <div class="share-area"><button type="button" id="shareBtn" class="share">SHARE COMPLETED FORM</button></div>
  <div class="footer">SSS Secure Digital Job Sheet</div>
</div>

<script>
(() => {
  const ITEMS = [
    "Base Jacks Centred",
    "Scaffold Level And Plumb",
    "Braces Engaged",
    "All Fittings Tightened",
    "Steel Boards Flush And Properly Seated",
    "Lap Boards Secured And Lashed",
    "Ties / Structural Ties Installed",
    "Double Rail Complete",
    "No Excessive Gaps",
    "Ladder, Gates And Access Secured And Complete",
    "Hop-Ups Correctly Installed With Check Fittings Where Applicable",
    "Mesh And Open Edge Protection Complete",
    "Scaffold Tag Updated",
    "Materials Consolidated And Stacked Correctly",
    "Site Left Clean Of All Access Gear",
    "Completion Photos Taken And Sent"
  ];
  const STORAGE_KEY = "sss_secure_job_sheet_v1";
  const $ = id => document.getElementById(id);

  const tbody = $("checklistBody");
  ITEMS.forEach((item, i) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${i+1}. ${item}</td>` + ["YES","NO","N/A"].map(v => `<td><input type="radio" name="q${i}" value="${v}" aria-label="${item} ${v}"></td>`).join("");
    tbody.appendChild(tr);
  });

  const sig = $("signature");
  const sctx = sig.getContext("2d");
  let drawing = false;
  let hasSignature = false;

  function sizeSignatureCanvas(preserve = false){
    const old = preserve && hasSignature ? sig.toDataURL("image/png") : "";
    const rect = sig.getBoundingClientRect();
    const ratio = Math.max(window.devicePixelRatio || 1, 1);
    sig.width = Math.round(rect.width * ratio);
    sig.height = Math.round(170 * ratio);
    sctx.setTransform(ratio,0,0,ratio,0,0);
    sctx.lineWidth = 2.6;
    sctx.lineCap = "round";
    sctx.lineJoin = "round";
    sctx.strokeStyle = "#111";
    if(old){
      const img = new Image();
      img.onload = () => sctx.drawImage(img,0,0,rect.width,170);
      img.src = old;
    }
  }
  function p(e){const r=sig.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
  sig.addEventListener("pointerdown", e => {drawing=true;hasSignature=true;sig.setPointerCapture?.(e.pointerId);const q=p(e);sctx.beginPath();sctx.moveTo(q.x,q.y);e.preventDefault();});
  sig.addEventListener("pointermove", e => {if(!drawing)return;const q=p(e);sctx.lineTo(q.x,q.y);sctx.stroke();e.preventDefault();});
  ["pointerup","pointercancel","pointerleave"].forEach(t => sig.addEventListener(t,e=>{drawing=false;try{sig.releasePointerCapture?.(e.pointerId)}catch(_){} saveDraft();}));
  $("clearSig").addEventListener("click",()=>{sctx.clearRect(0,0,sig.width,sig.height);hasSignature=false;saveDraft();});

  function collect(){
    const answers = ITEMS.map((_,i)=>document.querySelector(`input[name="q${i}"]:checked`)?.value || "");
    return {
      builder:$("builder").value,
      address:$("address").value,
      jobType:document.querySelector('input[name="jobType"]:checked')?.value || "",
      crew:$("crew").value,
      scaffolder:$("scaffolder").value,
      comments:$("comments").value,
      printName:$("printName").value,
      answers,
      signature:hasSignature ? sig.toDataURL("image/png") : "",
      completed:new Date().toLocaleString("en-AU")
    };
  }
  function saveDraft(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(collect()));}catch(_){}}
  function loadDraft(){
    try{
      const d=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null"); if(!d)return;
      $("builder").value=d.builder||""; $("address").value=d.address||""; $("crew").value=d.crew||"";
      $("scaffolder").value=d.scaffolder||""; $("comments").value=d.comments||""; $("printName").value=d.printName||"";
      if(d.jobType) document.querySelector(`input[name="jobType"][value="${d.jobType}"]`)?.setAttribute("checked","checked");
      (d.answers||[]).forEach((v,i)=>{if(v)document.querySelector(`input[name="q${i}"][value="${v}"]`)?.setAttribute("checked","checked");});
      if(d.signature){const img=new Image();img.onload=()=>{sctx.drawImage(img,0,0,sig.getBoundingClientRect().width,170);hasSignature=true;};img.src=d.signature;}
    }catch(_){}
  }
  ["builder","address","crew","scaffolder","comments","printName"].forEach(id=>$(id).addEventListener("input",saveDraft));
  document.addEventListener("change",e=>{if(e.target.matches('input[type="radio"]'))saveDraft();});

  function wrapText(ctx,text,x,y,maxWidth,lineHeight){
    const words=(text||"").split(/\s+/); let line=""; const lines=[];
    words.forEach(word=>{const test=line?line+" "+word:word;if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=word;}else line=test;});
    if(line)lines.push(line); lines.forEach((l,i)=>ctx.fillText(l,x,y+i*lineHeight)); return lines.length;
  }

  async function buildPng(data){
    const W=1240,H=1754; const c=document.createElement("canvas");c.width=W;c.height=H;const ctx=c.getContext("2d");
    ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#0A63C8";ctx.fillRect(0,0,W,150);ctx.fillStyle="#fff";ctx.textAlign="center";ctx.font="bold 48px Arial";ctx.fillText("SSS SECURE",W/2,62);ctx.font="bold 28px Arial";ctx.fillText("SUBCONTRACTOR JOB COMPLETION CHECKLIST",W/2,112);ctx.textAlign="left";
    let y=182; const m=55;
    const section=(t)=>{ctx.fillStyle="#1F8F4D";ctx.fillRect(m,y,W-m*2,42);ctx.fillStyle="#fff";ctx.font="bold 22px Arial";ctx.fillText(t,m+14,y+29);y+=58;};
    section("JOB DETAILS"); ctx.fillStyle="#172033";ctx.font="bold 20px Arial";
    const detail=(lab,val)=>{ctx.fillText(lab+":",m,y);ctx.font="20px Arial";const n=wrapText(ctx,val,m+245,y,W-m*2-245,26);ctx.font="bold 20px Arial";y+=Math.max(32,n*26+7);};
    detail("Builder",data.builder);detail("Site Address",data.address);detail("Job Type",data.jobType);detail("Crew",data.crew);detail("Competent Scaffolder",data.scaffolder);detail("Completed",data.completed);
    y+=8;section("CHECKLIST");
    ctx.font="bold 17px Arial";ctx.fillStyle="#172033";
    ITEMS.forEach((item,i)=>{const text=`${i+1}. ${item}`;const lines=[];const words=text.split(" ");let line="";words.forEach(word=>{const test=line?line+" "+word:word;if(ctx.measureText(test).width>760&&line){lines.push(line);line=word}else line=test});if(line)lines.push(line);const rh=Math.max(43,lines.length*22+15);ctx.strokeStyle="#d8e0e8";ctx.strokeRect(m,y,W-m*2,rh);lines.forEach((l,j)=>ctx.fillText(l,m+12,y+27+j*22));ctx.font="bold 20px Arial";ctx.fillStyle="#0A63C8";ctx.fillText(data.answers[i]||"",W-195,y+29);ctx.fillStyle="#172033";ctx.font="bold 17px Arial";y+=rh;});
    y+=14;section("COMMENTS");ctx.fillStyle="#172033";ctx.font="20px Arial";const commentLines=wrapText(ctx,data.comments,m,y,W-m*2,27);y+=Math.max(65,commentLines*27+18);
    section("DECLARATION");ctx.font="bold 20px Arial";ctx.fillStyle="#172033";ctx.fillText("Print Name:",m,y);ctx.font="20px Arial";ctx.fillText(data.printName,m+165,y);y+=35;ctx.font="bold 20px Arial";ctx.fillText("Signature:",m,y);
    if(data.signature){await new Promise(resolve=>{const img=new Image();img.onload=()=>{ctx.drawImage(img,m+150,y-28,470,100);resolve();};img.src=data.signature;});}
    ctx.fillStyle="#687586";ctx.font="16px Arial";ctx.textAlign="center";ctx.fillText("SSS Secure Digital Job Sheet",W/2,H-28);
    return await new Promise(resolve=>c.toBlob(resolve,"image/png",0.95));
  }

  function status(msg,type){const el=$("status");el.className="status "+type;el.textContent=msg;el.scrollIntoView({behavior:"smooth",block:"center"});}
  $("shareBtn").addEventListener("click",async()=>{
    const data=collect();saveDraft();status("Preparing completed form…","ok");
    try{
      const blob=await buildPng(data);const file=new File([blob],`SSS_Job_Sheet_${(data.address||"Completed").replace(/[^a-z0-9]+/gi,"_").slice(0,45)}.png`,{type:"image/png"});
      if(navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))){await navigator.share({title:"SSS Secure Job Sheet",text:"Completed SSS Secure Job Sheet",files:[file]});status("Completed form shared.","ok");}
      else{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);status("Completed form downloaded. Use your phone's Share button to send it.","ok");}
    }catch(err){if(err?.name!=="AbortError")status("The form could not be shared. Please open this page in Safari or Chrome and try again.","err");}
  });

  sizeSignatureCanvas(false);loadDraft();window.addEventListener("resize",()=>sizeSignatureCanvas(true));
})();
</script>
</body>
</html>
